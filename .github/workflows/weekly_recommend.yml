name: Weekly Gourmet Recommendation

on:
  schedule:
    # 毎週金曜 12:00 JST = 3:00 UTC
    - cron: '0 3 * * 5'
  workflow_dispatch:  # 手動トリガー（テスト用）

permissions:
  contents: write

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run recommendation pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # メールのリンクに付ける目隠しトークン（ISS-518）と、除外リストを読む GAS（ISS-475）
          SITE_GATE_TOKEN: ${{ secrets.SITE_GATE_TOKEN }}
        run: python -m backend.run_weekly

      - name: Commit updated data and photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ frontend/public/data/ frontend/public/photos/
          git diff --staged --quiet || git commit -m "chore: weekly recommendation $(date +%Y-%m-%d)"
          git push

  # ビルドとデプロイは deploy_pages.yml に一本化した（ISS-478）。
  # 上の push は GITHUB_TOKEN なので deploy_pages.yml の push トリガーは発火しない。
  # そのためここから明示的に呼ぶ。
  deploy:
    needs: recommend
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_pages.yml
    secrets: inherit
